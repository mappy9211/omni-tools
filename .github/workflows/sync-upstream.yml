name: Sync Upstream & Rebase Whitelabel

on:
  schedule:
    - cron: '0 0 * * 1' # Runs every Monday at midnight UTC
  workflow_dispatch:     # Allows triggering manually from GitHub Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync upstream and rebase
        run: |
          git remote add upstream https://github.com/iib0011/omni-tools.git || true
          git fetch upstream

          git checkout main
          git pull upstream main
          git push origin main

          git checkout whitelabel
          git rebase main
          git push origin whitelabel --force-with-lease
